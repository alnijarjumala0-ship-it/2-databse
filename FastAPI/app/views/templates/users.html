<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - FastAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #212529; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover { background: #343a40; color: #fff; }
        .sidebar a.active { background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="py-4 px-3 text-white">
                    <h5><i class="bi bi-speedometer2"></i> FastAPI</h5>
                </div>
                <a href="/" class="active"><i class="bi bi-house-door"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                <a href="/register"><i class="bi bi-person-plus"></i> Register</a>
                <a href="/profile"><i class="bi bi-person"></i> Profile</a>
                <a href="/admin"><i class="bi bi-shield-lock"></i> Admin</a>
                <a href="/docs"><i class="bi bi-file-earmark-code"></i> API Docs</a>
            </nav>
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-sm-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">User Management</h1>
                    <button class="btn btn-primary" onclick="loadUsers()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead><tr><th>ID</th><th>Email</th><th>Username</th><th>Full Name</th><th>Status</th><th>Admin</th><th>Actions</th></tr></thead>
                                <tbody id="usersTableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadUsers() {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('/users/all', { headers: { 'Authorization': 'Bearer ' + token } });
                const users = await response.json();
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = users.map(u => '<tr><td>' + u.id + '</td><td>' + u.email + '</td><td>' + u.username + '</td><td>' + (u.full_name || '-') + '</td><td><span class="badge ' + (u.is_active ? 'bg-success' : 'bg-secondary') + '">' + (u.is_active ? 'Active' : 'Inactive') + '</span></td><td><span class="badge ' + (u.is_admin ? 'bg-warning' : 'bg-secondary') + '">' + (u.is_admin ? 'Yes' : 'No') + '</span></td><td><button class="btn btn-sm btn-outline-warning" onclick="toggleAdmin(' + u.id + ', ' + (!u.is_admin) + ')">Toggle</button></td></tr>').join('');
            } catch (err) {
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Failed to load users.</td></tr>';
            }
        }
        async function toggleAdmin(userId, makeAdmin) {
            const token = localStorage.getItem('access_token');
            try {
                await fetch('/users/' + userId + '/toggle-admin', {
                    method: 'PATCH',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_admin: makeAdmin })
                });
                loadUsers();
            } catch (err) { console.error(err); }
        }
        loadUsers();
    </script>
</body>
</html>
