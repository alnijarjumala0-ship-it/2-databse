<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - FastAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #212529; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover { background: #343a40; color: #fff; }
        .sidebar a.active { background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="py-4 px-3 text-white">
                    <h5><i class="bi bi-speedometer2"></i> FastAPI</h5>
                </div>
                <a href="/" class="active"><i class="bi bi-house-door"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                <a href="/register"><i class="bi bi-person-plus"></i> Register</a>
                <a href="/profile"><i class="bi bi-person"></i> Profile</a>
                <a href="/admin"><i class="bi bi-shield-lock"></i> Admin</a>
                <a href="/docs"><i class="bi bi-file-earmark-code"></i> API Docs</a>
            </nav>
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-sm-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">User Profile</h1>
                    <button class="btn btn-outline-secondary" onclick="logout()">Logout</button>
                </div>
                <div class="row">
                    <div class="col-lg-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="bi bi-person-circle fs-1 text-primary"></i>
                                <h4 class="mt-3" id="username">User</h4>
                                <p class="text-muted" id="email">user@example.com</p>
                                <span class="badge bg-primary" id="roleBadge">User</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-header">
                                <i class="bi bi-info-circle me-1"></i> Profile Information
                            </div>
                            <div class="card-body">
                                <table class="table">
                                    <tbody>
                                        <tr><th style="width: 30%">ID</th><td id="userId">-</td></tr>
                                        <tr><th>Email</th><td id="userEmail">-</td></tr>
                                        <tr><th>Username</th><td id="userUsername">-</td></tr>
                                        <tr><th>Full Name</th><td id="userFullName">-</td></tr>
                                        <tr><th>Status</th><td id="userStatus">Active</td></tr>
                                        <tr><th>Admin</th><td id="userAdmin">No</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadProfile() {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('/auth/profile', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!response.ok) { window.location.href = '/login'; return; }
                const user = await response.json();
                document.getElementById('username').textContent = user.username;
                document.getElementById('email').textContent = user.email;
                document.getElementById('userId').textContent = user.id;
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userUsername').textContent = user.username;
                document.getElementById('userFullName').textContent = user.full_name || '-';
                document.getElementById('userStatus').textContent = user.is_active ? 'Active' : 'Inactive';
                document.getElementById('userAdmin').textContent = user.is_admin ? 'Yes' : 'No';
                document.getElementById('roleBadge').textContent = user.is_admin ? 'Admin' : 'User';
            } catch (err) {
                console.error(err);
            }
        }
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        }
        loadProfile();
    </script>
</body>
</html>
