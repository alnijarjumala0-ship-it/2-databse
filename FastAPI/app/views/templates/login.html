<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FastAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border: none; box-shadow: 0 1rem 3rem rgba(0,0,0,0.175); position: relative; }
        .spinner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            z-index: 10;
        }
        .spinner-overlay.visible { display: flex; }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            border: none;
            background: transparent;
        }
        .password-toggle-wrapper { position: relative; }
    </style>
</head>
<body>
    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="spinner-overlay" id="loginSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right fs-1 text-primary"></i>
                        <h3 class="mt-2">FastAPI</h3>
                        <p class="text-muted">Sign in to your account</p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
                        </div>
                        <div class="mb-3 password-toggle-wrapper">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                    </form>
                    <div class="text-center">
                        <small>Don't have an account? <a href="/register">Register</a></small>
                    </div>
                    <div id="result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const togglePwd = document.getElementById('togglePassword');
        const pwdInput = document.getElementById('password');
        const spinner = document.getElementById('loginSpinner');
        const submitBtn = document.querySelector('#loginForm button[type="submit"]');

        togglePwd.addEventListener('click', function() {
            const type = pwdInput.getAttribute('type');
            if (type === 'password') {
                pwdInput.setAttribute('type', 'text');
                this.innerHTML = '<i class="bi bi-eye"></i>';
            } else {
                pwdInput.setAttribute('type', 'password');
                this.innerHTML = '<i class="bi bi-eye-slash"></i>';
            }
        });

        function showSpinner() {
            spinner.classList.add('visible');
            submitBtn.disabled = true;
        }

        function hideSpinner() {
            spinner.classList.remove('visible');
            submitBtn.disabled = false;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');

            result.innerHTML = '';
            showSpinner();

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    result.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
                    setTimeout(() => window.location.href = '/profile', 1000);
                } else {
                    result.innerHTML = '<div class="alert alert-danger">' + (data.detail || 'Login failed') + '</div>';
                }
            } catch (err) {
                result.innerHTML = '<div class="alert alert-danger">An error occurred</div>';
            } finally {
                hideSpinner();
            }
        });
    </script>
</body>
</html>
