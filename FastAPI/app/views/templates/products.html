<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - FastAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #212529; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover { background: #343a40; color: #fff; }
        .sidebar a.active { background: #0d6efd; color: #fff; }
        .product-card { border: none; box-shadow: 0 0 1rem 0 rgba(0,0,0,0.1); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="py-4 px-3 text-white">
                    <h5><i class="bi bi-speedometer2"></i> FastAPI</h5>
                </div>
                <a href="/" class="active"><i class="bi bi-house-door"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                <a href="/register"><i class="bi bi-person-plus"></i> Register</a>
                <a href="/profile"><i class="bi bi-person"></i> Profile</a>
                <a href="/admin"><i class="bi bi-shield-lock"></i> Admin</a>
                <a href="/docs"><i class="bi bi-file-earmark-code"></i> API Docs</a>
            </nav>
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-sm-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Products</h1>
                    <button class="btn btn-primary" onclick="loadProducts()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
                <div id="productsContainer" class="row g-4">
                    <div class="col-12 text-center"><div class="spinner-border text-primary" role="status"></div></div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadProducts() {
            try {
                const response = await fetch('/products/list');
                const products = await response.json();
                const container = document.getElementById('productsContainer');
                if (!products.length) {
                    container.innerHTML = '<div class="col-12"><div class="alert alert-info">No products available.</div></div>';
                    return;
                }
                container.innerHTML = products.map(p => '<div class="col-md-6 col-lg-4"><div class="card product-card h-100"><div class="card-body"><h5 class="card-title">' + p.name + '</h5><p class="text-muted small">' + (p.description || 'No description') + '</p><div class="d-flex justify-content-between align-items-center"><span class="h5 text-primary mb-0">$' + p.price + '</span><span class="badge bg-secondary">Stock: ' + p.stock + '</span></div><small class="text-muted">Category: ' + (p.category || 'N/A') + '</small></div></div></div>').join('');
            } catch (err) {
                document.getElementById('productsContainer').innerHTML = '<div class="col-12"><div class="alert alert-danger">Failed to load products.</div></div>';
            }
        }
        loadProducts();
    </script>
</body>
</html>
