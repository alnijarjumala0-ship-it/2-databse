<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - FastAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #212529; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover { background: #343a40; color: #fff; }
        .sidebar a.active { background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="py-4 px-3 text-white">
                    <h5><i class="bi bi-speedometer2"></i> FastAPI</h5>
                </div>
                <a href="/" class="active"><i class="bi bi-house-door"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                <a href="/register"><i class="bi bi-person-plus"></i> Register</a>
                <a href="/profile"><i class="bi bi-person"></i> Profile</a>
                <a href="/admin"><i class="bi bi-shield-lock"></i> Admin</a>
                <a href="/docs"><i class="bi bi-file-earmark-code"></i> API Docs</a>
            </nav>
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-sm-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Settings</h1>
                </div>
                <div class="row g-4">
                    <div class="col-lg-8 mx-auto">
                        <div class="card mb-4">
                            <div class="card-header"><i class="bi bi-person-gear me-1"></i> Account Settings</div>
                            <div class="card-body">
                                <form id="settingsForm">
                                    <div class="mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" id="fullName" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" id="settingsEmail" class="form-control" disabled>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">New Password</label>
                                        <input type="password" id="newPassword" class="form-control" placeholder="Leave blank to keep current">
                                    </div>
                                    <button type="submit" class="btn btn-primary">Save Changes</button>
                                </form>
                                <div id="settingsResult" class="mt-3"></div>
                            </div>
                        </div>
                        <div class="card mb-4">
                            <div class="card-header"><i class="bi bi-shield-exclamation me-1"></i> Danger Zone</div>
                            <div class="card-body">
                                <p>Once you delete your account, there is no going back.</p>
                                <button class="btn btn-danger" onclick="if(confirm('Are you sure? This cannot be undone.')) { alert('Account deletion would be processed.'); }">Delete Account</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadSettings() {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('/auth/profile', { headers: { 'Authorization': 'Bearer ' + token } });
                const user = await response.json();
                document.getElementById('fullName').value = user.full_name || '';
                document.getElementById('settingsEmail').value = user.email;
            } catch (err) { console.error(err); }
        }
        document.getElementById('settingsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('settingsResult').innerHTML = '<div class="alert alert-success">Settings saved successfully!</div>';
        });
        loadSettings();
    </script>
</body>
</html>
