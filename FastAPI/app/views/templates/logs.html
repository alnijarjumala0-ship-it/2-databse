<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs - FastAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #212529; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover { background: #343a40; color: #fff; }
        .sidebar a.active { background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="py-4 px-3 text-white">
                    <h5><i class="bi bi-speedometer2"></i> FastAPI</h5>
                </div>
                <a href="/" class="active"><i class="bi bi-house-door"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                <a href="/register"><i class="bi bi-person-plus"></i> Register</a>
                <a href="/profile"><i class="bi bi-person"></i> Profile</a>
                <a href="/admin"><i class="bi bi-shield-lock"></i> Admin</a>
                <a href="/docs"><i class="bi bi-file-earmark-code"></i> API Docs</a>
            </nav>
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-sm-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Activity Logs</h1>
                    <button class="btn btn-primary" onclick="loadLogs()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead><tr><th>ID</th><th>User</th><th>Action</th><th>Resource</th><th>Method</th><th>Status</th><th>IP</th><th>Time</th></tr></thead>
                                <tbody id="logsTableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadLogs() {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('/logs/view?limit=50', { headers: { 'Authorization': 'Bearer ' + token } });
                const logs = await response.json();
                const tbody = document.getElementById('logsTableBody');
                tbody.innerHTML = logs.map(l => '<tr><td>' + (l.id ? l.id.substring(0, 8) : '-') + '</td><td>' + (l.user_email || '-') + '</td><td><span class="badge bg-info">' + l.action + '</span></td><td>' + l.resource + '</td><td><span class="badge bg-secondary">' + l.method + '</span></td><td><span class="badge ' + (l.status_code >= 400 ? 'bg-danger' : 'bg-success') + '">' + l.status_code + '</span></td><td>' + (l.ip_address || '-') + '</td><td>' + new Date(l.timestamp).toLocaleString() + '</td></tr>').join('');
            } catch (err) {
                document.getElementById('logsTableBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger">Failed to load logs.</td></tr>';
            }
        }
        loadLogs();
    </script>
</body>
</html>
