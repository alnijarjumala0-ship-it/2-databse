<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - FastAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #212529; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover { background: #343a40; color: #fff; }
        .sidebar a.active { background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="py-4 px-3 text-white">
                    <h5><i class="bi bi-speedometer2"></i> FastAPI</h5>
                </div>
                <a href="/" class="active"><i class="bi bi-house-door"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                <a href="/register"><i class="bi bi-person-plus"></i> Register</a>
                <a href="/profile"><i class="bi bi-person"></i> Profile</a>
                <a href="/admin"><i class="bi bi-shield-lock"></i> Admin</a>
                <a href="/docs"><i class="bi bi-file-earmark-code"></i> API Docs</a>
            </nav>
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-sm-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Contact Us</h1>
                </div>
                <div class="row g-4">
                    <div class="col-lg-8 mx-auto">
                        <div class="card mb-4">
                            <div class="card-body p-4">
                                <h2 class="text-primary mb-3">Get In Touch</h2>
                                <p class="text-muted">Have questions or feedback? We'd love to hear from you.</p>
                            </div>
                        </div>
                        <div class="card mb-4">
                            <div class="card-body">
                                <form id="contactForm">
                                    <div class="mb-3">
                                        <label class="form-label">Name</label>
                                        <input type="text" id="name" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" id="email" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Message</label>
                                        <textarea id="message" class="form-control" rows="5" required></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Send Message</button>
                                </form>
                                <div id="result" class="mt-3"></div>
                            </div>
                        </div>
                        <div class="row text-center">
                            <div class="col-md-4 mb-3">
                                <i class="bi bi-envelope fs-2 text-primary"></i>
                                <p class="mt-2">Email</p>
                                <p class="text-muted">support@fastapi.com</p>
                            </div>
                            <div class="col-md-4 mb-3">
                                <i class="bi bi-globe fs-2 text-primary"></i>
                                <p class="mt-2">Website</p>
                                <p class="text-muted">www.fastapi.com</p>
                            </div>
                            <div class="col-md-4 mb-3">
                                <i class="bi bi-geo-alt fs-2 text-primary"></i>
                                <p class="mt-2">Location</p>
                                <p class="text-muted">Global</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('result').innerHTML = '<div class="alert alert-success">Thank you! Your message has been sent.</div>';
            document.getElementById('contactForm').reset();
        });
    </script>
</body>
</html>
